# =====================================================================
#  SWING TRADING BOT - SETTINGS
#  You can edit this file with Notepad. Lines starting with # are notes.
#  After changing anything, just restart the bot.
# =====================================================================

# ---------------------------------------------------------------------
# ACCOUNT
# ---------------------------------------------------------------------
account:
  # "cent" (recommended under $1,000) or "standard"
  type: standard
  # Starting balance used for backtests (in US dollars)
  backtest_starting_balance: 300
  # Commission per 1 standard lot, round trip, in USD (0 for most cent/standard accounts)
  commission_per_lot: 0.0

# ---------------------------------------------------------------------
# TELEGRAM ALERTS (Optional - phone notifications)
# ---------------------------------------------------------------------
telegram:
  enabled: true          # set to true once you fill in bot_token and chat_id
  bot_token: ""           # Loaded securely from .env (TELEGRAM_BOT_TOKEN)
  chat_id: ""             # Loaded securely from .env (TELEGRAM_CHAT_ID)

# ---------------------------------------------------------------------
# ECONOMIC CALENDAR & NEWS SHIELD (ForexFactory integration)
# ---------------------------------------------------------------------
news:
  enabled: true                    # Automatically blocks trades during high-impact news
  blackout_minutes_before: 60      # Minutes before standard high-impact release to pause entries (increased from 30)
  blackout_minutes_after: 60       # Minutes after standard high-impact release to pause entries (increased from 30)
  advance_alert_minutes: 60        # Minutes before high-impact release to send priority Telegram alert
  tier1_blackout_minutes_before: 120 # Minutes before Tier-1 super-events (FOMC, NFP, CPI, Rate Decisions) to pause entries
  tier1_blackout_minutes_after: 120  # Minutes after Tier-1 release to pause entries (covers press conferences & volatility absorption)
  auto_breakeven_before_news: true # Automatically move SL to BE on in-profit trades (>= +0.5R) before news
  cancel_pending_before_news: true # Automatically cancel pending orders on affected currency to avoid slippage

# ---------------------------------------------------------------------
# MT5 CONNECTION
# Leave login/password/server empty if MT5 is already open and logged in.
# ---------------------------------------------------------------------
mt5:
  terminal_path: ""      # e.g. "C:/Program Files/MetaTrader 5/terminal64.exe" (optional)
  login: ""
  password: ""
  server: ""
  # Some brokers add a suffix to symbol names (e.g. EURUSDm or EURUSD.c).
  # Leave empty to auto-detect.
  symbol_suffix: ""

# ---------------------------------------------------------------------
# DATA & TIMEFRAMES
# ---------------------------------------------------------------------
data:
  source: mt5
  timeframe: H4      # Primary Institutional Swing Timeframe: "H4" (4-Hour candles)
  secondary_timeframe: H1  # Dual-Horizon Momentum Timeframe: "H1" (1-Hour candles)
  dual_timeframe_scanning: true # Simultaneously monitors both H4 and H1 for setups
  h1_bars: 2000      # ~3 months of 1-hour candles for live scanning
  h4_bars: 1000      # ~6 months of 4-hour candles for live scanning
  d1_bars: 400       # ~1.5 years of daily candles for live scanning

# ---------------------------------------------------------------------
# SYMBOLS
# ---------------------------------------------------------------------
symbols:
  forex:
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
    - EURJPY
    - EURGBP
    - NZDUSD
    - CADJPY
    - EURCAD
    - USDCAD
  # Metals: set to empty list to disable metal trading
  metals: []

# ---------------------------------------------------------------------
# RISK MANAGER  (hard rules - the optimizer can never change these)
# ---------------------------------------------------------------------
risk:
  risk_per_trade_pct: 1.0          # Base % of equity risked per trade (~$3.47 on $347 balance)
  max_risk_per_trade_pct: 1.6      # Hard cap ceiling (prevents any trade from ever exceeding ~1.5% risk)
  max_open_positions: 3            # Maximum concurrent AT-RISK positions
  free_roll_slot_recycling: true   # Risk-Free trades (SL at/above Break-Even) become Free Runners & free up slots
  conviction_sizing:
    enabled: true
    tier_b_max_score: 0.74
    tier_b_risk_pct: 0.80          # Score 0.70 - 0.74: conservative 0.80% risk (~$2.75)
    tier_a_max_score: 0.84
    tier_a_risk_pct: 1.00          # Score 0.75 - 0.84: standard 1.00% risk (~$3.50)
    tier_aplus_risk_pct: 1.25      # Score >= 0.85: A+ high-conviction 1.25% risk (~$4.30)
  max_total_open_risk_pct: 3.5     # Max concurrent open at-risk exposure
  max_currency_exposure_pct: 2.5   # Net at-risk exposure on any single currency (max 2 correlated at-risk trades)
  pending_orders_enabled: true     # Use Limit orders on pullbacks & Stop orders on breakouts
  pending_order_expiry_hours: 4    # Auto-cancel pending orders if unfilled after 4 hours (prevents overnight lingering)
  cancel_pending_outside_session: true # Auto-cancel unfilled pending orders at session close (18:00 UTC) & Friday cutoff
  symbol_loss_cooldown_hours: 24   # Mandatory 24h lockout after a loss to prevent churn/revenge trading
  daily_loss_limit_pct: 4.0        # Hard daily portfolio circuit breaker (-4.0% closed loss in a day stops new entries)
  weekly_loss_limit_pct: 8.0       # Hard weekly portfolio circuit breaker (-8.0% closed loss in a week stops new entries)
  drawdown_throttle_pct: 10.0      # from peak -> risk is halved
  kill_switch_drawdown_pct: 20.0   # from peak -> all trading stops
  high_volatility_risk_factor: 0.5
  min_stop_loss_pips: 20.0         # Mandatory 20-pip safety floor: stops can never be tighter than 20 pips
  max_spread_to_stop_ratio: 0.10   # spread must be <= 10% of stop distance
  max_spread_vs_normal: 2.0        # spread must be <= 2x its normal level
  max_entry_slippage_atr: 0.3      # skip if price ran away > 0.3 x ATR(H4)
  # Strategy Health Degradation Guard (Rule 10)
  strategy_health:
    enabled: true
    min_lookback_trades: 5         # minimum trades before evaluating degradation
    max_consecutive_losses: 3      # if 3 losses in a row -> throttle strategy risk to 50%
    min_win_rate_pct: 35.0         # if rolling win rate < 35% -> throttle strategy risk to 50%
    recovery_trades: 2             # consecutive wins required to restore full health
  # Execution Circuit Breaker (Rule 11)
  circuit_breaker:
    enabled: true
    max_consecutive_exec_errors: 3 # pause order placement if 3 broker errors occur
    pause_duration_minutes: 60     # cooldown time in minutes
  # Institutional Session Liquidity Filter (Upgrade #1)
  session_filter:
    enabled: true
    start_utc_hour: 7              # 07:00 UTC (London Open / Frankfurt active)
    start_utc_minute: 0
    end_utc_hour: 17               # 17:00 UTC (London Close / US Session active)
    end_utc_minute: 0
    allow_asian_session_for_jpy_aud: false # Enforce London/NY peak liquidity across all pairs
  # 5:00 PM EST Rollover Shield (Upgrade #2)
  rollover_shield:
    enabled: true
    # Global interbank settlement window: 21:45 UTC to 22:30 UTC
    freeze_start_utc_hour: 21
    freeze_start_utc_minute: 45
    freeze_end_utc_hour: 22
    freeze_end_utc_minute: 30
  # Friday Weekend-Gap Protection Cutoff (14:00 UTC = 15:00 WAT)
  friday_cutoff_utc_hour: 14
  friday_cutoff_server_hour: 18

# ---------------------------------------------------------------------
# TRADE MANAGEMENT & PROFIT LOCKING (Balanced Model)
# ---------------------------------------------------------------------
trade_management:
  enabled: true
  breakeven_trigger_r: 0.8         # Move SL to Break-Even at +0.8R
  breakeven_buffer_r: 0.1          # Cushion above entry (0.1R) to cover commission/spread
  partial_tp_trigger_r: 1.2        # Bank partial profit at +1.2R
  partial_tp_volume_pct: 0.33      # Bank 33% of position into cash
  step_lock_trigger_r: 1.5         # Step-lock guaranteed profit at +1.5R
  step_lock_guarantee_r: 0.6       # Guaranteed locked profit (+0.6R)
  dynamic_trail_trigger_r: 1.8     # Trail SL once trade reaches +1.8R
  trail_atr_multiplier: 1.2        # Distance behind price: 1.2 * lower_atr
  trail_to_candle_structure: true  # Trail behind previous candle High/Low

# ---------------------------------------------------------------------
# SIGNAL SCORER & QUALITY FILTER
# ---------------------------------------------------------------------
scorer:
  min_score_threshold: 0.70        # Adjusted standard: only A+ setups with strong confluence pass (0.70+)

# ---------------------------------------------------------------------
# MARKET-REGIME AGENT (daily candles)
# ---------------------------------------------------------------------
regime:
  adx_period: 14
  adx_trend_threshold: 25
  adx_range_threshold: 20
  ema_fast: 50
  ema_slow: 200
  ema_slope_lookback: 10
  atr_period: 14
  high_vol_percentile: 0.90       # ATR in top 10% of last 252 days
  high_vol_lookback: 252
  bb_period: 20
  bb_std: 2.0
  compression_percentile: 0.20    # BB width in lowest 20% of last 126 days
  compression_lookback: 126
  range_ema_drift_lookback: 20
  range_ema_drift_atr: 1.0
  confirm_bars: 2                 # new regime must hold 2 daily closes

# ---------------------------------------------------------------------
# STRATEGIES
# ---------------------------------------------------------------------
strategies:
  trend:
    enabled: true
    ema_fast: 20
    ema_slow: 50
    atr_period: 14
    pullback_lookback: 5
    max_close_below_slow_atr: 0.5
    stop_buffer_atr: 1.2           # Upgraded from 0.5: 1.2 ATR buffer to survive spread expansion
    min_stop_atr: 1.2              # Upgraded from 1.0: Minimum 1.2 ATR stop distance
    min_stop_pips: 20.0            # Mandatory 20-pip minimum stop floor to prevent whipsaws
    max_stop_atr: 3.0
    target_r: 2.0                  # Upgraded from 1.5: Enforce minimum 2.0R reward-to-risk
    breakeven_at_r: 1.0            # Move to BE at +1.0R to lock in risk-free trade early
    breakeven_buffer_r: 0.05
    trail_atr_d1: 2.5
    max_hold_days: 42
    strong_adx: 25                 # Upgraded from 30: Confirmed trend threshold
  breakout:
    enabled: true
    donchian_period: 20
    atr_period: 14
    breakout_buffer_atr: 0.2
    stop_buffer_atr: 1.0
    min_body_ratio: 0.5
  mean_reversion:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_oversold: 35
    rsi_overbought: 65
    stop_buffer_atr: 0.75

# ---------------------------------------------------------------------
# BACKTEST PASS / FAIL CRITERIA (strategy_spec.md section 10)
# ---------------------------------------------------------------------
validation:
  min_trades: 100
  min_expectancy_r: 0.15
  min_profit_factor: 1.3
  max_drawdown_pct: 20.0
  oos_fraction: 0.30
  oos_min_profit_factor: 1.15
  oos_min_expectancy_ratio: 0.60
  min_profitable_symbol_share: 0.60
  max_single_symbol_profit_share: 0.50
  monte_carlo_runs: 10000
  monte_carlo_max_dd_pct: 20.0
